name: ci

on:
  push:
    tags:
      - "*.*.*.*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-android: "true"

      - name: Set branch and version
        env:
          REPO_TAG: ${{ github.ref_name }}
        id: set_branch_and_version
        run: |
          echo "BRANCH_NAME=${REPO_TAG##*.}" >> $GITHUB_ENV
          echo "VERSION=${REPO_TAG%.*}" >> $GITHUB_ENV

      - name: Determine app id
        run: |
          echo "Branch: $BRANCH_NAME"
          if [ "$BRANCH_NAME" == "experimental" ]; then
            echo "APP_ID=1890870" >> $GITHUB_ENV
          else
            echo "APP_ID=1874900" >> $GITHUB_ENV
          fi

      - name: Configure Docker storage
        run: |
          sudo mkdir -p /etc/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check free space
        run: |
          echo "Free space:"
          df -h

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.BRANCH_NAME }}
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
          build-args: |
            STEAM_APP_ID=${{ env.APP_ID }}
            BRANCH=${{ env.BRANCH_NAME }}
            VERSION=${{ env.VERSION }}
